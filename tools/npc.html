<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPC Generator &mdash; DnD Tools</title>
<meta name="description" content="Generate a complete D&amp;D NPC in one click: name, ancestry, trade, appearance, personality, secret and ability scores.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129497;</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
<script>window.PAGE = 'npc'; window.BASE = '..';</script>
</head>
<body>

<main class="wrap section">
  <h1>NPC Generator</h1>
  <p class="muted">One click and you have someone to talk to &mdash; including a reason to need the party.</p>

  <div class="grid cols-2" style="align-items:start">
    <div class="panel no-print">
      <h2>Settings</h2>
      <div class="field-row">
        <div class="field">
          <label for="f-ancestry">Ancestry</label>
          <select id="f-ancestry"><option value="">Random</option></select>
        </div>
        <div class="field">
          <label for="f-gender">Names</label>
          <select id="f-gender">
            <option value="">Random</option>
            <option value="m">Masculine names</option>
            <option value="f">Feminine names</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="f-occupation">Occupation</label>
        <select id="f-occupation"><option value="">Random</option></select>
      </div>
      <div class="field">
        <label for="f-count">Number of NPCs</label>
        <input id="f-count" type="number" value="1" min="1" max="10">
      </div>
      <div class="check" style="margin-bottom:12px">
        <input type="checkbox" id="f-stats" checked>
        <label for="f-stats">Include ability scores</label>
      </div>
      <button class="btn btn-primary btn-block" id="btn-gen">Generate</button>
    </div>

    <div class="stack">
      <div class="panel">
        <div class="panel-head">
          <h2>Result</h2>
          <div class="btn-group no-print">
            <button class="btn btn-sm" data-copy="#npc-out">Copy</button>
            <button class="btn btn-sm" onclick="window.print()">Print</button>
          </div>
        </div>
        <div id="npc-out"><div class="empty">No NPC generated yet.</div></div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/dice.js"></script>
<script src="../assets/data/names.js"></script>
<script src="../assets/data/npc.js"></script>
<script src="../assets/js/pages/npc-page.js"></script>
</body>
</html>
