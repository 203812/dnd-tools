<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monsterboek &mdash; DnD Tools</title>
<meta name="description" content="Doorzoekbare D&amp;D-statblocks met filters op challenge rating, type en omgeving.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128009;</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
<script>window.PAGE = 'monsters'; window.BASE = '..';</script>
</head>
<body>

<main class="wrap section">
  <h1>Monsterboek</h1>
  <p class="muted">Statblocks uit de SRD 5.1. Klik op een monster voor de volledige gegevens.</p>

  <div class="panel no-print" style="margin-bottom:16px">
    <div class="field-row">
      <div class="field" style="flex:2 1 220px">
        <label for="q">Zoeken</label>
        <input id="q" placeholder="naam, type of omgeving" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-type">Type</label>
        <select id="f-type"><option value="">Alle</option></select>
      </div>
      <div class="field">
        <label for="f-env">Omgeving</label>
        <select id="f-env"><option value="">Alle</option></select>
      </div>
      <div class="field">
        <label for="f-cr-min">CR van</label>
        <select id="f-cr-min"></select>
      </div>
      <div class="field">
        <label for="f-cr-max">CR tot</label>
        <select id="f-cr-max"></select>
      </div>
      <div class="field">
        <label for="f-sort">Sorteren</label>
        <select id="f-sort">
          <option value="name">Naam</option>
          <option value="cr">Challenge rating</option>
          <option value="hp">Hitpoints</option>
        </select>
      </div>
    </div>
  </div>

  <div class="grid cols-2" style="align-items:start">
    <div class="panel">
      <div class="panel-head">
        <h2>Resultaten</h2>
        <span class="muted" id="count"></span>
      </div>
      <div id="list" class="scroll-y" style="max-height:620px"></div>
    </div>

    <div id="detail">
      <div class="panel"><div class="empty">Kies een monster uit de lijst.</div></div>
    </div>
  </div>
</main>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/dice.js"></script>
<script src="../assets/data/monsters.js"></script>
<script src="../assets/js/pages/monsters-page.js"></script>
</body>
</html>
