<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestiary &mdash; DnD Tools</title>
<meta name="description" content="Searchable D&amp;D stat blocks with filters for challenge rating, type and environment.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128009;</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
<script>window.PAGE = 'monsters'; window.BASE = '..';</script>
</head>
<body>

<main class="wrap section">
  <h1>Bestiary</h1>
  <p class="muted">Stat blocks from the SRD 5.1. Click a monster for the full entry.</p>

  <div class="panel no-print" style="margin-bottom:16px">
    <div class="field-row">
      <div class="field" style="flex:2 1 220px">
        <label for="q">Search</label>
        <input id="q" placeholder="name, type or environment" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-type">Type</label>
        <select id="f-type"><option value="">All</option></select>
      </div>
      <div class="field">
        <label for="f-env">Environment</label>
        <select id="f-env"><option value="">All</option></select>
      </div>
      <div class="field">
        <label for="f-cr-min">CR from</label>
        <select id="f-cr-min"></select>
      </div>
      <div class="field">
        <label for="f-cr-max">CR to</label>
        <select id="f-cr-max"></select>
      </div>
      <div class="field">
        <label for="f-sort">Sort by</label>
        <select id="f-sort">
          <option value="name">Name</option>
          <option value="cr">Challenge rating</option>
          <option value="hp">Hit points</option>
        </select>
      </div>
    </div>
  </div>

  <div class="grid cols-2" style="align-items:start">
    <div class="panel">
      <div class="panel-head">
        <h2>Results</h2>
        <span class="muted" id="count"></span>
      </div>
      <div id="list" class="scroll-y" style="max-height:620px"></div>
    </div>

    <div id="detail">
      <div class="panel"><div class="empty">Pick a monster from the list.</div></div>
    </div>
  </div>
</main>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/dice.js"></script>
<script src="../assets/data/monsters.js"></script>
<script src="../assets/js/pages/monsters-page.js"></script>
</body>
</html>
