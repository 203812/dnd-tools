<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naamgenerator &mdash; DnD Tools</title>
<meta name="description" content="Genereer D&amp;D-namen per volk, plus herbergen, winkels, dorpen en gezelschappen.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128220;</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
<script>window.PAGE = 'names'; window.BASE = '..';</script>
</head>
<body>

<main class="wrap section">
  <h1>Naamgenerator</h1>
  <p class="muted">Klik op een naam om hem te kopi&euml;ren.</p>

  <div class="grid cols-2" style="align-items:start">

    <div class="panel">
      <h2>Personages</h2>
      <div class="field-row">
        <div class="field">
          <label for="f-volk">Volk</label>
          <select id="f-volk"></select>
        </div>
        <div class="field">
          <label for="f-geslacht">Geslacht</label>
          <select id="f-geslacht">
            <option value="">Beide</option>
            <option value="m">Mannelijke namen</option>
            <option value="v">Vrouwelijke namen</option>
          </select>
        </div>
        <div class="field" style="flex:0 0 110px">
          <label for="f-aantal">Aantal</label>
          <input id="f-aantal" type="number" value="8" min="1" max="30">
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="btn-namen">Genereer namen</button>
      <div id="out-namen" class="stack" style="margin-top:14px"></div>
    </div>

    <div class="stack">
      <div class="panel">
        <h2>Plaatsen en zaken</h2>
        <div class="chips" id="soort-chips"></div>
        <div class="field" style="margin-top:12px">
          <label for="f-plaats-aantal">Aantal</label>
          <input id="f-plaats-aantal" type="number" value="6" min="1" max="20">
        </div>
        <div id="out-plaats" class="stack" style="margin-top:6px"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Herberg met inhoud</h2>
          <button class="btn btn-sm" id="btn-herberg">Nieuwe herberg</button>
        </div>
        <div id="out-herberg"><div class="empty">Nog geen herberg gerold.</div></div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/dice.js"></script>
<script src="../assets/data/names.js"></script>
<script src="../assets/data/npc.js"></script>
<script src="../assets/js/pages/names-page.js"></script>
</body>
</html>
