<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Generator &mdash; DnD Tools</title>
<meta name="description" content="Generate D&amp;D names by ancestry, plus taverns, shops, villages and adventuring companies.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128220;</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
<script>window.PAGE = 'names'; window.BASE = '..';</script>
</head>
<body>

<main class="wrap section">
  <h1>Name Generator</h1>
  <p class="muted">Click a name to copy it.</p>

  <div class="grid cols-2" style="align-items:start">

    <div class="panel">
      <h2>Characters</h2>
      <div class="field-row">
        <div class="field">
          <label for="f-ancestry">Ancestry</label>
          <select id="f-ancestry"></select>
        </div>
        <div class="field">
          <label for="f-gender">Names</label>
          <select id="f-gender">
            <option value="">Both</option>
            <option value="m">Masculine</option>
            <option value="f">Feminine</option>
          </select>
        </div>
        <div class="field" style="flex:0 0 110px">
          <label for="f-count">Count</label>
          <input id="f-count" type="number" value="8" min="1" max="30">
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="btn-names">Generate names</button>
      <div id="out-names" class="stack" style="margin-top:14px"></div>
    </div>

    <div class="stack">
      <div class="panel">
        <h2>Places and businesses</h2>
        <div class="chips" id="kind-chips"></div>
        <div class="field" style="margin-top:12px">
          <label for="f-place-count">Count</label>
          <input id="f-place-count" type="number" value="6" min="1" max="20">
        </div>
        <div id="out-places" class="stack" style="margin-top:6px"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>A tavern with contents</h2>
          <button class="btn btn-sm" id="btn-tavern">New tavern</button>
        </div>
        <div id="out-tavern"><div class="empty">No tavern rolled yet.</div></div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/dice.js"></script>
<script src="../assets/data/names.js"></script>
<script src="../assets/data/npc.js"></script>
<script src="../assets/js/pages/names-page.js"></script>
</body>
</html>
